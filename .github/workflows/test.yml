name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      # dist/ is committed and is what the installed plugin runs, so it must match src/
      - name: dist is up to date
        run: |
          npm run build
          git diff --exit-code -- dist || (echo "dist/ is stale: run npm run build and commit it" && exit 1)
